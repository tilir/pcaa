# Builds and runs host-side SystemC unit tests on GitHub Actions.

name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  systemc-unit-tests:
    name: SystemC unit tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            g++ \
            libgtest-dev \
            libsystemc-dev \
            ninja-build

      - name: Configure and test Debug
        run: |
          cmake -S . -B build-debug -G Ninja -DBUILD_TESTING=ON
          cmake --build build-debug --parallel
          ctest --test-dir build-debug --output-on-failure

      - name: Configure and test Release
        run: |
          cmake -S . -B build-release -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release --parallel
          ctest --test-dir build-release --output-on-failure
